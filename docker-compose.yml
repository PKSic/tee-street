services:
  postgres:
    image: postgres:16-alpine
    container_name: test_tshirt_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tshirt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tshirt_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-tshirt_store}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro

volumes:
  pgdata:
